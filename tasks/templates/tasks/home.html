<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Django Task Manager</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#121212;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:700px;
    background:#1e1e1e;
    padding:40px;
    border-radius:25px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

h1{
    color:white;
    font-size:60px;
}

.logout-btn{
    background:#ff3366;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

.form-box{
    display:flex;
    gap:15px;
    margin-bottom:30px;
}

input{
    flex:1;
    padding:18px;
    border:none;
    border-radius:15px;
    font-size:22px;
}

.add-btn{
    background:#333;
    color:white;
    border:none;
    padding:18px 30px;
    border-radius:15px;
    font-size:22px;
    cursor:pointer;
}

.task{
    background:#2a2a2a;
    padding:20px;
    border-radius:18px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.task-title{
    color:white;
    font-size:28px;
}

.completed{
    text-decoration:line-through;
    opacity:0.5;
}

.actions{
    display:flex;
    gap:15px;
}

.action-btn{
    text-decoration:none;
    font-size:28px;
}

.empty{
    color:white;
    font-size:28px;
    text-align:center;
    margin-top:20px;
}

.user-info{
    color:#aaa;
    margin-bottom:20px;
    font-size:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="top-bar">

<h1>🚀 Django Task Manager</h1>

<form action="/logout/" method="POST">

{% csrf_token %}

<button class="logout-btn" type="submit">

Logout

</button>

</form>

</div>

<div class="user-info">

Logged in as:
<strong>{{ request.user.username }}</strong>

</div>

<form method="POST" class="form-box">

{% csrf_token %}

<input
type="text"
name="title"
placeholder="Enter task"
required
>

<button type="submit" class="add-btn">

Add

</button>

</form>

{% for task in tasks %}

<div class="task">

<div class="task-title {% if task.completed %}completed{% endif %}">

{{ task.title }}

</div>

<div class="actions">

<a
href="/complete/{{ task.id }}/"
class="action-btn"
>
✅
</a>

<a
href="/edit/{{ task.id }}/"
class="action-btn"
>
✏️
</a>

<a
href="/delete/{{ task.id }}/"
class="action-btn"
>
❌
</a>

</div>

</div>

{% empty %}

<div class="empty">

No tasks added yet.

</div>

{% endfor %}

</div>

</body>

</html>
