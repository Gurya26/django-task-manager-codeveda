<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Django Task Manager</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#121212;
    color:white;
    padding:20px;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:900px;
    background:#1e1e1e;
    padding:35px;
    border-radius:25px;
    box-shadow:0 0 20px rgba(255,255,255,0.05);
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    flex-wrap:wrap;
    gap:15px;
}

h1{
    font-size:50px;
}

.logout-btn{
    background:#ff3366;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

.user-info{
    color:#aaa;
    margin-bottom:20px;
    font-size:18px;
}

.search-box{
    margin-bottom:25px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:18px;
}

.form-box{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:15px;
    margin-bottom:35px;
}

.form-box input,
.form-box select{
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:17px;
}

.add-btn{
    background:#333;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

.task{
    background:#2a2a2a;
    padding:20px;
    border-radius:18px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
}

.task-left{
    flex:1;
}

.task-title{
    font-size:28px;
    margin-bottom:8px;
}

.completed{
    text-decoration:line-through;
    opacity:0.5;
}

.task-details{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    font-size:15px;
    color:#bbb;
}

.priority{
    padding:5px 12px;
    border-radius:20px;
    font-weight:bold;
}

.high{
    background:#ff3b3b;
}

.medium{
    background:#ffb300;
    color:black;
}

.low{
    background:#00c853;
}

.actions{
    display:flex;
    gap:15px;
}

.action-btn{
    text-decoration:none;
    font-size:28px;
}

.empty{
    text-align:center;
    font-size:25px;
    color:#999;
    margin-top:30px;
}

@media(max-width:768px){

    h1{
        font-size:38px;
    }

    .form-box{
        grid-template-columns:1fr;
    }

    .task{
        flex-direction:column;
        align-items:flex-start;
    }

    .actions{
        width:100%;
        justify-content:flex-end;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="top-bar">

<h1>🚀 Task Manager</h1>

<form action="/logout/" method="POST">

{% csrf_token %}

<button class="logout-btn">

Logout

</button>

</form>

</div>

<div class="user-info">

Logged in as:
<strong>{{ request.user.username }}</strong>

</div>

<form method="GET" class="search-box">

<input
type="text"
name="search"
placeholder="🔍 Search tasks..."
>

</form>

<form method="POST" class="form-box">

{% csrf_token %}

<input
type="text"
name="title"
placeholder="Enter task"
required
>

<select name="priority">

<option value="High">
High
</option>

<option value="Medium" selected>
Medium
</option>

<option value="Low">
Low
</option>

</select>

<input
type="date"
name="due_date"
>

<button type="submit" class="add-btn">

Add

</button>

</form>

{% for task in tasks %}

<div class="task">

<div class="task-left">

<div class="task-title {% if task.completed %}completed{% endif %}">

{{ task.title }}

</div>

<div class="task-details">

<span class="priority
{% if task.priority == 'High' %}
high
{% elif task.priority == 'Medium' %}
medium
{% else %}
low
{% endif %}
">

{{ task.priority }}

</span>

{% if task.due_date %}

<span>

📅 {{ task.due_date }}

</span>

{% endif %}

</div>

</div>

<div class="actions">

<a
href="/complete/{{ task.id }}/"
class="action-btn"
>
✅
</a>

<a
href="/edit/{{ task.id }}/"
class="action-btn"
>
✏️
</a>

<a
href="/delete/{{ task.id }}/"
class="action-btn"
>
❌
</a>

</div>

</div>

{% empty %}

<div class="empty">

No tasks added yet.

</div>

{% endfor %}

</div>

</body>

</html>
