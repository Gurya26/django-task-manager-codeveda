<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Task</title>

<style>

body{
    background:#121212;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.container{
    background:#1e1e1e;
    padding:40px;
    border-radius:20px;
    width:400px;
}

h1{
    color:white;
    text-align:center;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    background:#ff3366;
    border:none;
    color:white;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>✏️ Edit Task</h1>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="title"
value="{{ task.title }}"
required
>

<button type="submit">
Update Task
</button>

</form>

</div>

</body>

</html>
