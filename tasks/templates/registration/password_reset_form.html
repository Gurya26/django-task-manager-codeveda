<!DOCTYPE html>
<html>
<head>
    <title>Password Reset</title>

    <style>
        body{
            background:black;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:#1e1e1e;
            padding:40px;
            border-radius:20px;
            width:400px;
        }

        input{
            width:100%;
            padding:15px;
            margin-top:10px;
            border:none;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:15px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            background:#ff3366;
            color:white;
            font-size:20px;
        }
    </style>
</head>

<body>

<div class="box">

<h1>🔑 Reset Password</h1>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">
Send Reset Link
</button>

</form>

</div>

</body>
</html>
