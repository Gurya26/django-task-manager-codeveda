<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Django Task Manager</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#000;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:600px;
            background:#1e1e1e;
            padding:40px;
            border-radius:25px;
            color:white;
            box-shadow:0 0 25px rgba(255,255,255,0.1);
        }

        h1{
            text-align:center;
            font-size:70px;
            margin-bottom:30px;
        }

        label{
            display:block;
            margin-bottom:10px;
            font-size:20px;
        }

        input{
            width:100%;
            padding:18px;
            margin-bottom:25px;
            border:none;
            border-radius:15px;
            font-size:20px;
            outline:none;
        }

        button{
            width:100%;
            padding:18px;
            border:none;
            border-radius:15px;
            background:#333;
            color:white;
            font-size:22px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#ff2d6f;
        }

        .signup-link{
            text-align:center;
            margin-top:25px;
            font-size:18px;
        }

        .signup-link a{
            color:#00d9ff;
            text-decoration:none;
        }

        .forgot-password{
            text-align:right;
            margin-bottom:20px;
        }

        .forgot-password a{
            color:#00d9ff;
            text-decoration:none;
            font-size:16px;
        }

        .forgot-password a:hover{
            text-decoration:underline;
        }

        @media(max-width:600px){

            .container{
                padding:25px;
            }

            h1{
                font-size:50px;
            }

            input,
            button{
                font-size:18px;
                padding:15px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🔐 Login</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="signup-link">
            Don’t have an account?
            <a href="{% url 'signup' %}">Signup</a>
        </div>

    </div>

</body>
</html>
